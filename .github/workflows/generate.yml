name: Daily Draft Generation

on:
  schedule:
    # High-frequency morning cron schedule matrix (8:30 AM to 12:30 PM IST).
    # GitHub Actions can delay cron jobs by 1-2 hours during peak load.
    # The generation script skips instantly if today's drafts already exist, so multiple triggers are 100% safe and fast (~10s).
    - cron: '0 3 * * *'   # 8:30 AM IST
    - cron: '30 3 * * *'  # 9:00 AM IST (primary)
    - cron: '0 4 * * *'   # 9:30 AM IST
    - cron: '30 4 * * *'  # 10:00 AM IST
    - cron: '0 5 * * *'   # 10:30 AM IST
    - cron: '30 5 * * *'  # 11:00 AM IST
    - cron: '0 6 * * *'   # 11:30 AM IST
    - cron: '30 6 * * *'  # 12:00 PM IST
    - cron: '0 7 * * *'   # 12:30 PM IST
  workflow_dispatch:
    inputs:
      force:
        description: "Force overwrite today's drafts"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Kolkata

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        # Fetch latest to avoid push conflicts from earlier cron runs
        fetch-depth: 1

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: 'npm'

    - name: Install dependencies
      run: npm install --omit=dev

    - name: Run Generation Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        if [ "${{ github.event.inputs.force }}" = "true" ]; then
          node generate-daily.js --force
        else
          node generate-daily.js
        fi

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Pull latest changes first to avoid push conflicts from concurrent cron runs
        git pull --rebase origin main || true
        
        # Check specifically if history.json has changes
        if git diff --quiet docs/data/history.json; then
          echo "No new drafts generated or saved. Skipping commit."
        else
          git add docs/data/history.json docs/avatar_daily_*.jpg || git add docs/data/history.json
          git commit -m "Automated: Daily LinkedIn drafts generated"
          
          # Retry push up to 3 times in case of concurrent cron conflicts
          for i in 1 2 3; do
            if git push origin main; then
              echo "Push succeeded on attempt $i"
              break
            else
              echo "Push failed on attempt $i, pulling and retrying..."
              git pull --rebase origin main
            fi
          done
        fi
